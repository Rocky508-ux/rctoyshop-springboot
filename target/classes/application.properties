spring.application.name=backend

# --- 資料庫連線 ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rc_toy_shop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:abc123}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# 啟動時執行 schema.sql 和 data.sql
spring.sql.init.mode=always

# --- Debug 用的 log（需要時再打開註解） ---
# 看 Spring Data JDBC 實際送出的 SQL
#logging.level.org.springframework.jdbc.core=DEBUG
# 看 Spring Security 的驗證流程（排查 401/403 很有用）
#logging.level.org.springframework.security=DEBUG
